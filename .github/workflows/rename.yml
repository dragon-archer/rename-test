name: Windows rename, Defender and MSYS build comparison

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      runs:
        description: Runs per pressure/API and MSYS build group (1-100; 16 scanners retained)
        type: number
        default: 20
        required: true

permissions:
  contents: read

jobs:
  rename:
    name: ${{ matrix.os }} / Defender ${{ matrix.defender }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025, windows-latest]
        defender: [as-is, 'on', 'off']
    defaults:
      run:
        shell: pwsh
    env:
      RUNNER_LABEL: ${{ matrix.os }} / Defender ${{ matrix.defender }}
      TEST_RUNS: ${{ inputs.runs || 20 }}

    steps:
      - uses: actions/checkout@v7

      - name: Record original Defender state (hosted CI only)
        run: ./ci-defender.ps1 -State '${{ matrix.defender }}' -Phase before

      - name: Install MSYS build tools
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          update: true
          install: gcc make libtool

      - name: Build with MSVC and record environment
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          New-Item -ItemType Directory -Force -Path build, metadata | Out-Null
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw 'MSVC installation not found.' }
          & "$installation/Common7/Tools/Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          & cl.exe /nologo /O2 /W4 /WX /std:c11 /TC /Fe:build/rename-win32.exe /Fo:build/rename-win32.obj rename-win32.c 2>&1 | Tee-Object -FilePath metadata/build.log
          if ($LASTEXITCODE -ne 0) { throw "MSVC failed with exit code $LASTEXITCODE" }
          & dumpbin.exe /nologo /dependents build/rename-win32.exe | Set-Content metadata/dependencies.txt
          if ($LASTEXITCODE -ne 0) { throw 'dumpbin failed.' }
          $windows = Get-ItemProperty 'HKLM:/SOFTWARE/Microsoft/Windows NT/CurrentVersion'
          [pscustomobject]@{
            runner_label = $env:RUNNER_LABEL
            defender_requested = '${{ matrix.defender }}'
            runner_image = $env:ImageOS
            image_version = $env:ImageVersion
            windows_build = "$($windows.CurrentBuildNumber).$($windows.UBR)"
            processor_count = [Environment]::ProcessorCount
            msvc_tools_version = $env:VCToolsVersion
            source_sha256 = (Get-FileHash rename-win32.c).Hash
            executable_sha256 = (Get-FileHash build/rename-win32.exe).Hash
            workspace = $env:GITHUB_WORKSPACE
            volume = (Get-Volume -DriveLetter ([System.IO.Path]::GetPathRoot($env:GITHUB_WORKSPACE).Substring(0, 1)) | Select-Object DriveLetter, FileSystem, FileSystemLabel)
          } | ConvertTo-Json -Depth 3 | Set-Content metadata/environment.json
          Get-Content metadata/environment.json, metadata/dependencies.txt

      - name: Configure and verify Defender experiment
        id: defender
        run: ./ci-defender.ps1 -State '${{ matrix.defender }}' -Phase configure

      - name: High-pressure reproduction first, then pressure and POSIX comparison
        run: ./run-tests.ps1 -Runs ([int]$env:TEST_RUNS) -ScannerCounts 16,0,1,4

      - name: MSYS make and libtool build, serial, no artificial scanner
        if: ${{ !cancelled() && steps.defender.outcome == 'success' }}
        shell: msys2 {0}
        run: /usr/bin/bash ./run-msys-build.sh "$TEST_RUNS" 1 results-msys-j1

      - name: MSYS make and libtool build, parallel, no artificial scanner
        if: ${{ !cancelled() && steps.defender.outcome == 'success' }}
        shell: msys2 {0}
        run: /usr/bin/bash ./run-msys-build.sh "$TEST_RUNS" 8 results-msys-j8

      - name: Record final Defender state and validate treatment
        if: always()
        run: |
          if ('${{ steps.defender.outcome }}' -eq 'success') {
            ./ci-defender.ps1 -State '${{ matrix.defender }}' -Phase after
          } else {
            Write-Warning 'Defender configuration did not succeed; recording status without validating treatment.'
            ./ci-defender.ps1 -State as-is -Phase after
          }

      - name: Upload logs, frequency summary and executable
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rename-${{ matrix.os }}-defender-${{ matrix.defender }}-${{ github.run_attempt }}
          path: |
            metadata/
            results/*.md
            results/*.csv
            results/**/*.log
            results-msys-*/*.csv
            results-msys-*/*.txt
            results-msys-*/**/*.log
            build/rename-win32.exe
          if-no-files-found: warn
